<!doctype html>
<!--
  Source for public/og-image.png: the link-preview card shown when the site's URL is pasted into
  iMessage, Slack, Discord, X, or LinkedIn. It must stay exactly 1200x630.

  Re-render (uses an already-installed Playwright; nothing is added to package.json). From the repo root:

    node -e "const { chromium } = require('playwright'); (async () => {
      const b = await chromium.launch(); const p = await b.newPage({ viewport: { width: 1200, height: 630 } });
      await p.goto('file://' + process.cwd() + '/scripts/og-image.html');
      await p.evaluate(() => document.fonts.ready);
      await p.screenshot({ path: 'public/og-image.png' }); await b.close(); })()"

  Fonts are self-hosted subsets in scripts/fonts/ (licenses in scripts/fonts/OFL.txt); no network is used.
  The logo is public/favicon.svg. The pixel word below is the app's real 5x7 font:
  rasterize('MARK', 26, { level: 4, offset: 1 }) from shared/art.mjs, rows = weekdays, columns = weeks.
  Palette is taken from web/style.css (dark theme and the five contribution shades).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Inter Display'; src: url('fonts/inter-display-bold.woff2'); font-weight: 700; }
  @font-face { font-family: 'Inter'; src: url('fonts/inter-regular.woff2'); font-weight: 400; }
  @font-face { font-family: 'Inter'; src: url('fonts/inter-semibold.woff2'); font-weight: 600; }
  @font-face { font-family: 'Graffiti Serif'; src: url('fonts/graffiti-serif-italic.woff2'); font-style: italic; }
  :root {
    --page: #111612; --surface: #1a211b; --soft: #202a21; --text: #e6ecde; --muted: #a0ac98; --border: #354031;
    --lime: #c6f36a; --l0: #28332c; --l1: #294a30; --l2: #4b7d3c; --l3: #85b84d;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: 'Inter', sans-serif; color: var(--text);
    background:
      radial-gradient(780px 460px at 100% 0%, rgba(198, 243, 106, 0.13), transparent 70%),
      radial-gradient(620px 380px at 0% 100%, rgba(75, 125, 60, 0.16), transparent 70%),
      var(--page);
  }

  /* Left column */
  .left { position: absolute; left: 72px; top: 64px; width: 540px; height: 502px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 0 0 1px var(--border); }
  .brand b { font-family: 'Inter Display'; font-weight: 700; font-size: 40px; letter-spacing: -0.04em; }
  .brand b span { font-family: 'Inter'; font-weight: 400; }
  .tag { font-weight: 600; font-size: 14px; letter-spacing: 0.16em; padding: 6px 11px; border-radius: 7px; background: #293425; color: #c0d2ae; margin-top: 4px; }
  h1 { margin-top: 36px; font-family: 'Inter Display'; font-weight: 700; font-size: 100px; line-height: 0.98; letter-spacing: -0.045em; }
  h1 em {
    position: relative; z-index: 0; display: inline-block; margin-top: 2px;
    font-family: 'Graffiti Serif'; font-style: italic; font-weight: 400; font-size: 132px; letter-spacing: -0.01em; color: #d4f499;
  }
  h1 em::after {
    content: ''; position: absolute; z-index: -1; left: -8px; right: -12px; bottom: 14px; height: 30px;
    background: #456027; transform: rotate(-3deg);
  }
  .sub { margin-top: 24px; font-size: 28px; line-height: 1.36; color: var(--muted); max-width: 500px; }
  .foot { margin-top: auto; display: flex; gap: 12px; }
  .chip { font-weight: 600; font-size: 20px; padding: 9px 18px; border-radius: 999px; }
  .c1 { background: #294a30; color: #c6f36a; }
  .c2 { background: #35572f; color: #d8f4a5; }
  .c3 { background: #3e6a35; color: #e6f8c4; }
  .c4 { background: #2a3a2c; color: #b9cfae; }

  /* Right: tilted product motif built from the app's own canvas vocabulary */
  .stage { position: absolute; left: 650px; top: 52px; width: 490px; height: 526px; }
  .card { position: absolute; border-radius: 28px; background: var(--surface); border: 2px solid var(--border); box-shadow: 0 34px 70px rgba(0, 0, 0, 0.45), 0 6px 16px rgba(0, 0, 0, 0.3); }
  .back { left: 58px; top: 22px; width: 420px; height: 330px; transform: rotate(6deg); background: #17201a; border-color: #2c382a; }
  .front { left: 6px; top: 92px; width: 468px; height: 310px; transform: rotate(-4deg); padding: 22px 26px; }
  .toolbar { display: flex; align-items: center; gap: 8px; }
  .pill { font-weight: 600; font-size: 16px; padding: 9px 15px; border-radius: 10px; color: var(--muted); border: 1px solid var(--border); background: var(--soft); }
  .pill.on { background: var(--lime); color: #26361a; border-color: var(--lime); }
  .year { margin-left: auto; font-weight: 600; font-size: 16px; letter-spacing: 0.08em; color: var(--muted); }
  .year b { margin-left: 8px; padding: 7px 14px; border: 1px solid var(--border); border-radius: 10px; background: #131a15; color: var(--text); letter-spacing: 0.04em; }
  .grid { margin-top: 26px; display: grid; grid-template-columns: repeat(26, 13px); grid-auto-rows: 13px; gap: 3px; }
  .grid i { border-radius: 3px; background: var(--l0); }
  .grid i.on { background: var(--lime); }
  .legend { margin-top: 22px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .legend i { width: 14px; height: 14px; border-radius: 3px; }
  .legend span { margin: 0 4px; }
  .stat { position: absolute; left: 292px; top: 386px; padding: 16px 24px 16px 22px; border-radius: 22px; transform: rotate(4deg); background: #1f2a21; }
  .stat b { display: block; font-family: 'Inter Display'; font-weight: 700; font-size: 52px; line-height: 1; letter-spacing: -0.03em; color: var(--lime); }
  .stat small { display: block; margin-top: 6px; font-size: 16px; font-weight: 600; color: var(--muted); }
  .go { position: absolute; left: 14px; top: 436px; display: flex; align-items: center; gap: 12px; padding: 17px 24px; border-radius: 14px; transform: rotate(-3deg);
        background: linear-gradient(165deg, #d6f68f, #bfe85f); color: #26361a; font-weight: 600; font-size: 21px; box-shadow: 0 18px 36px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
  .go svg { width: 22px; height: 22px; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <img src="../public/favicon.svg" alt="" />
      <b>git<span>graffiti</span></b><span class="tag">STUDIO</span>
    </div>
    <h1>Leave your<br /><em>mark.</em></h1>
    <p class="sub">Turn your GitHub contribution graph into pixel art.</p>
    <div class="foot">
      <span class="chip c1">Paint</span><span class="chip c2">Stamp text</span><span class="chip c3">5 shades</span><span class="chip c4">Local-first</span>
    </div>
  </div>

  <div class="stage">
    <div class="card back"></div>
    <div class="card front">
      <div class="toolbar">
        <span class="pill on">Paint</span><span class="pill">Erase</span><span class="pill">Cycle</span>
        <span class="year">YEAR<b>2025</b></span>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend">Less <i style="background:var(--l0)"></i><i style="background:var(--l1)"></i><i style="background:var(--l2)"></i><i style="background:var(--l3)"></i><i style="background:var(--lime)"></i> More</div>
    </div>
    <div class="card stat"><b>680</b><small>planned commits</small></div>
    <div class="go">Generate repository
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </div>
  </div>

  <script>
    // The app's real canvas data for "MARK" (see header comment). 68 painted days x 10 commits = 680.
    const MARK = [".#...#..###..####..#...#..",".##.##.#...#.#...#.#..#...",".#.#.#.#...#.#...#.#.#....",".#.#.#.#####.####..##.....",".#...#.#...#.#.#...#.#....",".#...#.#...#.#..#..#..#...",".#...#.#...#.#...#.#...#.."];
    const grid = document.getElementById('grid');
    for (let r = 0; r < 7; r++) for (let c = 0; c < 26; c++) {
      const i = document.createElement('i'); if (MARK[r][c] === '#') i.className = 'on'; grid.append(i);
    }
  </script>
</body>
</html>
